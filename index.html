<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Reel" />
<meta name="theme-color" content="#EDEAFB" />
<title>Reel — Máster Audiovisual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin:0; padding:0; font-family:'Inter',sans-serif; -webkit-tap-highlight-color: transparent; }
  * { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const INK = '#241F3A';
const MUTED = '#8A82A8';
const BG = '#F7F5FC';
const OUTER = '#EDEAFB';
const PURPLE = '#8C7CF0';
const PURPLE_LIGHT = '#B9AEF5';
const ORANGE = '#F5A94E';
const BLUE = '#AFD1F5';
const MINT = '#8FE3C4';
const PINK = '#F0A8E0';
const NAVY = '#1B1730';

const MODULES = [
  { id: 'm1', num: 1, title: 'Lenguaje audiovisual', weeks: 2, estWeeks: false,
    objetivo: 'Aprender a pensar como director antes que como editor.',
    topics: ['Historia del cine', 'Gramática audiovisual', 'Tipos de planos', 'Movimiento de cámara', 'Composición', 'Regla de los 180°', 'Continuidad', 'Ritmo visual', 'Psicología del montaje'],
    libros: ['The Visual Story — Bruce Block', 'In the Blink of an Eye — Walter Murch', "The Five C's of Cinematography — Joseph Mascelli"],
    youtube: ['StudioBinder', 'Every Frame a Painting', 'This Guy Edits', 'Cinecom.net'],
    projectLabel: 'Proyecto final',
    proyecto: 'Editar un montaje de 1 minuto sin efectos, usando solo el ritmo de los cortes para transmitir una emoción.' },
  { id: 'm2', num: 2, title: 'DaVinci Resolve', weeks: 4, estWeeks: false,
    objetivo: 'Dominar completamente el programa.',
    overview: ['Media Page', 'Cut Page', 'Edit Page', 'Color Page', 'Fairlight', 'Deliver'],
    topics: ['Timeline', 'Bins', 'Multicam', 'Proxy Media', 'Keyframes', 'Adjustment Clips', 'Compound Clips', 'Fusion básico', 'Exportaciones'],
    recursosOficiales: ['Manual oficial de DaVinci Resolve (gratuito)', 'Curso oficial de Blackmagic Design (gratuito)'],
    youtube: ['Casey Faris', 'MrAlexTech', 'Darren Mostyn', 'JayAreTV'],
    projectLabel: 'Proyecto final',
    proyecto: 'Editar un vlog de 5 minutos.' },
  { id: 'm3', num: 3, title: 'Edición profesional', weeks: 4, estWeeks: false,
    topics: ['Ritmo', 'J Cuts', 'L Cuts', 'Speed Ramping', 'Match Cuts', 'Seamless Transitions', 'B-Roll', 'Storytelling'],
    libros: ['The Technique of Film Editing'],
    projectLabel: 'Ejercicio',
    proyecto: 'Recrear un Reel famoso.' },
  { id: 'm4', num: 4, title: 'Audio', weeks: 2, estWeeks: false,
    topics: ['Ecualización', 'Compresión', 'Foley', 'Diseño sonoro', 'Ambientes', 'Música'],
    libros: ['The Sound Effects Bible'],
    recursos: ['Freesound', 'Artlist', 'Epidemic Sound'],
    projectLabel: 'Proyecto final',
    proyecto: 'Rehacer completamente el sonido de una escena sin usar el audio original.' },
  { id: 'm5', num: 5, title: 'Color', weeks: 3, estWeeks: false,
    topics: ['Color Science', 'Corrección primaria', 'Corrección secundaria', 'Curvas', 'Qualifiers', 'Power Windows', 'LUTs', 'Looks cinematográficos'],
    libros: ['Color Correction Handbook — Alexis Van Hurkman'],
    youtube: ['Darren Mostyn', 'Cullen Kelly'],
    projectLabel: 'Proyecto final',
    proyecto: 'Colorizar un cortometraje.' },
  { id: 'm6', num: 6, title: 'Motion Graphics', weeks: 7, estWeeks: true,
    overview: ['Opción A — Fusion (DaVinci)', 'Opción B — After Effects'],
    topics: ['Animación', 'Tracking', 'Máscaras', 'Motion Blur', 'Graph Editor', 'Expresiones', 'Partículas'],
    libros: ['Creating Motion Graphics with After Effects'],
    projectLabel: null },
  { id: 'm7', num: 7, title: 'Edición para redes sociales', weeks: 6, estWeeks: true,
    topics: ['Hooks', 'Retención', 'Algoritmos', 'Shorts', 'TikTok', 'Reels', 'Subtítulos', 'Viralidad'],
    youtube: ['MrBeast', 'Alex Hormozi', 'Ali Abdaal', 'Hayden Hillier-Smith'],
    youtubeLabel: 'Analiza el contenido de',
    projectLabel: 'Proyecto final',
    proyecto: 'Editar 30 Shorts.' },
  { id: 'm8', num: 8, title: 'Negocio', weeks: 6, estWeeks: true,
    topics: ['Marca personal', 'Portfolio', 'Clientes', 'Presupuestos', 'Contratos', 'Networking', 'Productividad'],
    libros: ['The Freelance Manifesto', 'The Personal MBA'],
    projectLabel: 'Proyecto final',
    proyecto: 'Conseguir el primer cliente.' },
];

const RECURSOS_PERMANENTES = {
  'Música': ['Artlist', 'Epidemic Sound', 'Soundstripe'],
  'Sonidos': ['Freesound', 'Boom Library', 'Sonniss'],
  'Videos': ['Pexels', 'Mixkit', 'Pixabay'],
  'Tipografías': ['Google Fonts', 'Fontshare'],
  'Color': ['CinePrint LUTs', 'Juan Melara PowerGrades'],
  'Inspiración': ['Behance', 'ArtStation', 'Vimeo Staff Picks'],
};

const SEGUNDA_ETAPA = [
  { name: 'Blender', desc: 'Modelado y animación 3D' },
  { name: 'Resolume Arena', desc: 'VJ en vivo' },
  { name: 'MadMapper', desc: 'Projection mapping' },
  { name: 'TouchDesigner', desc: 'Visuales generativos' },
  { name: 'Notch', desc: 'Gráficos en tiempo real' },
  { name: 'Unreal Engine', desc: 'Escenografía virtual' },
];

const STATUS_STYLE = {
  pending: { bg: BLUE, badge: 'Por hacer', ink: '#1B3A5C' },
  progress: { bg: ORANGE, badge: 'En progreso', ink: '#4A2E05' },
  done: { bg: MINT, badge: 'Completado', ink: '#0B3A2A' },
};

const STORAGE_KEY = 'reel-progress-v1';

function App() {
  const [progress, setProgress] = useState(null);
  const [activeId, setActiveId] = useState('m1');
  const [sheetId, setSheetId] = useState(null);
  const [tab, setTab] = useState('home');

  function withDefaults(data) {
    const next = { ...data };
    MODULES.forEach(m => {
      const existing = next[m.id];
      if (!existing) {
        next[m.id] = { checked: Array(m.topics.length).fill(false), hours: 0, notes: '' };
      } else {
        next[m.id] = {
          checked: Array.isArray(existing.checked) && existing.checked.length === m.topics.length ? existing.checked : Array(m.topics.length).fill(false),
          hours: typeof existing.hours === 'number' ? existing.hours : 0,
          notes: typeof existing.notes === 'string' ? existing.notes : '',
        };
      }
    });
    return next;
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      setProgress(withDefaults(raw ? JSON.parse(raw) : {}));
    } catch (e) {
      setProgress(withDefaults({}));
    }
  }, []);

  useEffect(() => {
    if (!progress) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
  }, [progress]);

  if (!progress) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: OUTER, color: MUTED }}>
        <span className="text-sm">Cargando…</span>
      </div>
    );
  }

  function toggleTopic(moduleId, idx) {
    setProgress(prev => {
      const checked = [...prev[moduleId].checked];
      checked[idx] = !checked[idx];
      return { ...prev, [moduleId]: { ...prev[moduleId], checked } };
    });
  }
  function updateHours(moduleId, hours) {
    setProgress(prev => ({ ...prev, [moduleId]: { ...prev[moduleId], hours } }));
  }
  function updateNotes(moduleId, notes) {
    setProgress(prev => ({ ...prev, [moduleId]: { ...prev[moduleId], notes } }));
  }
  function getStatus(m) {
    const p = progress[m.id];
    const total = m.topics.length;
    const done = p.checked.filter(Boolean).length;
    const ratio = total ? done / total : 0;
    const status = done === 0 ? 'pending' : done === total ? 'done' : 'progress';
    return { done, total, ratio, status };
  }

  let totalWeeks = 0, weighted = 0;
  MODULES.forEach(m => { const { ratio } = getStatus(m); totalWeeks += m.weeks; weighted += m.weeks * ratio; });
  const overallPct = totalWeeks ? Math.round((weighted / totalWeeks) * 100) : 0;
  const totalHours = Object.values(progress).reduce((s, p) => s + (p.hours || 0), 0);
  const allDone = overallPct === 100;

  const activeModule = MODULES.find(m => m.id === activeId) || MODULES[0];
  const activeIndex = MODULES.findIndex(m => m.id === activeModule.id);
  const nextModule = MODULES[(activeIndex + 1) % MODULES.length];
  const sheetModule = MODULES.find(m => m.id === sheetId);

  function ModuleCard({ m, compact }) {
    const { done, total, status } = getStatus(m);
    const s = STATUS_STYLE[status];
    return (
      <button onClick={() => setSheetId(m.id)} className="rounded-3xl p-4 text-left flex flex-col justify-between w-full" style={{ background: s.bg, height: compact ? '168px' : '190px' }}>
        <div>
          <span className="text-xs px-2 py-1 rounded-full inline-block mb-2" style={{ background: 'rgba(255,255,255,0.55)', color: s.ink }}>{s.badge}</span>
          <div className="font-bold leading-tight" style={{ fontFamily: "'Baloo 2',sans-serif", color: s.ink, fontSize: compact ? '17px' : '20px' }}>{m.title}</div>
          <div className="text-xs mt-1" style={{ color: s.ink, opacity: 0.75 }}>{m.weeks} semana{m.weeks > 1 ? 's' : ''} · {done}/{total} competencias</div>
        </div>
        <div className="text-xs font-semibold" style={{ color: s.ink, opacity: 0.85 }}>Módulo {String(m.num).padStart(2, '0')} →</div>
      </button>
    );
  }

  const NAV_ITEMS = [
    { id: 'home', icon: '🏠' },
    { id: 'modules', icon: '▦' },
    { id: 'progress', icon: '📊' },
    { id: 'resources', icon: '📚' },
  ];

  function NavBtn({ id, icon }) {
    const active = tab === id;
    return (
      <button onClick={() => setTab(id)} className="w-11 h-11 rounded-full flex items-center justify-center text-base" style={{ background: active ? '#fff' : 'transparent' }}>
        {icon}
      </button>
    );
  }

  return (
    <div className="min-h-screen flex items-start justify-center p-4 md:p-10" style={{ background: `linear-gradient(180deg, ${OUTER} 0%, #E3DEFB 100%)` }}>
      <div className="relative w-full" style={{ maxWidth: '420px', background: BG, borderRadius: '2rem', boxShadow: '0 20px 60px rgba(90,70,160,0.18)', padding: '20px', minHeight: '640px' }}>
        <div className="pb-24">

          {tab === 'home' && (
            <React.Fragment>
              <div className="flex items-center justify-between mb-5">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-full flex items-center justify-center text-lg" style={{ background: `linear-gradient(135deg, ${PURPLE}, ${PURPLE_LIGHT})` }}>🎬</div>
                  <div>
                    <div className="text-base font-bold" style={{ fontFamily: "'Baloo 2',sans-serif", color: INK }}>Hola 👋</div>
                    <div className="text-xs" style={{ color: MUTED }}>{overallPct}% del máster · {totalHours}h registradas</div>
                  </div>
                </div>
                <button onClick={() => setTab('resources')} className="w-10 h-10 rounded-full flex items-center justify-center" style={{ background: '#fff', boxShadow: '0 2px 8px rgba(90,70,160,0.12)' }}>🔍</button>
              </div>

              <div className="relative rounded-3xl p-5 mb-5 overflow-hidden" style={{ background: `linear-gradient(135deg, ${PURPLE_LIGHT}, ${PURPLE})`, minHeight: '150px' }}>
                <div className="absolute" style={{ right: '-10px', bottom: '-18px' }}>
                  <div style={{ width: '90px', height: '90px', borderRadius: '1.2rem', background: ORANGE, position: 'absolute', right: 0, bottom: 0, opacity: 0.9 }} />
                  <div style={{ width: '64px', height: '64px', borderRadius: '9999px', background: '#F6D34D', position: 'absolute', right: '58px', bottom: '10px', opacity: 0.9 }} />
                  <div style={{ width: '54px', height: '54px', borderRadius: '9999px', background: '#5B5470', position: 'absolute', right: '4px', bottom: '76px', opacity: 0.85 }} />
                </div>
                <div className="relative" style={{ maxWidth: '60%' }}>
                  <div className="font-bold mb-1" style={{ fontFamily: "'Baloo 2',sans-serif", color: '#1E1836', fontSize: '19px' }}>Reto de esta semana</div>
                  <div className="text-xs mb-3" style={{ color: '#3C3560' }}>Avanza en {activeModule.title}</div>
                  <div className="flex gap-1.5">
                    {['🎬', '🎧', '🎨', '🎵'].map((icon, i) => (
                      <div key={i} className="w-7 h-7 rounded-full flex items-center justify-center text-xs" style={{ background: 'rgba(255,255,255,0.4)' }}>{icon}</div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="flex gap-2 overflow-x-auto mb-6" style={{ paddingBottom: '4px' }}>
                {MODULES.map(m => {
                  const { status } = getStatus(m);
                  const dot = status === 'done' ? MINT : status === 'progress' ? ORANGE : '#C7C2DE';
                  const isActive = activeId === m.id;
                  return (
                    <button key={m.id} onClick={() => setActiveId(m.id)} className="flex flex-col items-center justify-center rounded-2xl flex-shrink-0" style={{ width: '54px', height: '68px', background: isActive ? NAVY : '#fff', boxShadow: isActive ? 'none' : '0 2px 6px rgba(90,70,160,0.08)' }}>
                      <span className="rounded-full mb-1" style={{ width: '6px', height: '6px', background: dot }} />
                      <span className="text-xs" style={{ color: isActive ? '#fff' : MUTED }}>M{m.num}</span>
                      <span className="text-xs font-semibold" style={{ color: isActive ? '#fff' : INK }}>{m.weeks}s</span>
                    </button>
                  );
                })}
              </div>

              <div className="text-lg font-bold mb-3" style={{ fontFamily: "'Baloo 2',sans-serif", color: INK }}>Tu plan</div>
              <div className="grid grid-cols-2 gap-3 mb-3">
                <ModuleCard m={activeModule} />
                <ModuleCard m={nextModule} />
              </div>
              <button onClick={() => setTab('resources')} className="w-full rounded-3xl p-4 flex items-center justify-center gap-4" style={{ background: PINK }}>
                <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: 'rgba(255,255,255,0.6)' }}>📚</div>
                <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: 'rgba(255,255,255,0.6)' }}>▶️</div>
                <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: 'rgba(255,255,255,0.6)' }}>🎵</div>
              </button>
            </React.Fragment>
          )}

          {tab === 'modules' && (
            <React.Fragment>
              <div className="text-lg font-bold mb-4" style={{ fontFamily: "'Baloo 2',sans-serif", color: INK }}>Módulos</div>
              <div className="grid grid-cols-2 gap-3">
                {MODULES.map(m => <ModuleCard key={m.id} m={m} compact />)}
              </div>
            </React.Fragment>
          )}

          {tab === 'progress' && (
            <React.Fragment>
              <div className="font-bold mb-1" style={{ fontFamily: "'Baloo 2',sans-serif", color: INK, fontSize: '34px' }}>{overallPct}%</div>
              <div className="text-xs mb-5" style={{ color: MUTED }}>completado · {totalHours}h registradas en total</div>
              <div className="space-y-4">
                {MODULES.map(m => {
                  const { done, total, ratio, status } = getStatus(m);
                  const color = status === 'done' ? MINT : status === 'progress' ? ORANGE : '#C7C2DE';
                  return (
                    <div key={m.id}>
                      <div className="flex justify-between text-xs mb-1">
                        <span style={{ color: INK, fontWeight: 600 }}>{m.title}</span>
                        <span style={{ color: MUTED }}>{done}/{total}</span>
                      </div>
                      <div className="w-full rounded-full" style={{ background: '#E7E2F7', height: '8px' }}>
                        <div className="rounded-full" style={{ width: `${ratio * 100}%`, background: color, height: '8px' }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </React.Fragment>
          )}

          {tab === 'resources' && (
            <React.Fragment>
              <div className="text-lg font-bold mb-3" style={{ fontFamily: "'Baloo 2',sans-serif", color: INK }}>Recursos permanentes</div>
              <div className="grid grid-cols-2 gap-3 mb-6">
                {Object.entries(RECURSOS_PERMANENTES).map(([cat, items]) => (
                  <div key={cat} className="rounded-2xl p-3" style={{ background: '#fff' }}>
                    <div className="text-xs font-semibold mb-1" style={{ color: PURPLE }}>{cat}</div>
                    <div className="text-xs" style={{ color: MUTED }}>{items.join(' · ')}</div>
                  </div>
                ))}
              </div>
              <div className="flex items-center gap-2 mb-3">
                <span>🔒</span>
                <div className="text-lg font-bold" style={{ fontFamily: "'Baloo 2',sans-serif", color: INK }}>Segunda etapa</div>
              </div>
              <div className="space-y-2">
                {SEGUNDA_ETAPA.map(s => (
                  <div key={s.name} className="rounded-2xl p-3" style={{ background: '#fff', opacity: allDone ? 1 : 0.6 }}>
                    <div className="text-sm font-semibold" style={{ color: INK }}>{s.name}</div>
                    <div className="text-xs" style={{ color: MUTED }}>{s.desc}</div>
                  </div>
                ))}
              </div>
              <p className="text-xs mt-3" style={{ color: MUTED }}>Se desbloquea al completar los 8 módulos.</p>
            </React.Fragment>
          )}
        </div>

        <div className="absolute flex items-center gap-1 px-2 py-2 rounded-full" style={{ background: NAVY, bottom: '16px', left: '50%', transform: 'translateX(-50%)' }}>
          {NAV_ITEMS.map(n => <NavBtn key={n.id} id={n.id} icon={n.icon} />)}
        </div>
      </div>

      {sheetModule && (
        <div className="fixed inset-0 flex items-end justify-center" style={{ background: 'rgba(20,15,40,0.45)', zIndex: 50 }} onClick={() => setSheetId(null)}>
          <div onClick={e => e.stopPropagation()} className="w-full overflow-y-auto" style={{ background: '#fff', maxWidth: '420px', borderTopLeftRadius: '2rem', borderTopRightRadius: '2rem', maxHeight: '85vh', padding: '24px' }}>
            {(() => {
              const { done, total, status } = getStatus(sheetModule);
              const s = STATUS_STYLE[status];
              return (
                <React.Fragment>
                  <div className="flex items-start justify-between mb-4">
                    <div>
                      <span className="text-xs px-2 py-1 rounded-full inline-block mb-2" style={{ background: s.bg, color: s.ink }}>{s.badge} · {done}/{total}</span>
                      <div className="font-bold" style={{ fontFamily: "'Baloo 2',sans-serif", color: INK, fontSize: '22px' }}>{sheetModule.title}</div>
                      <div className="text-xs mt-1" style={{ color: MUTED }}>Módulo {String(sheetModule.num).padStart(2, '0')} · {sheetModule.weeks} semana{sheetModule.weeks > 1 ? 's' : ''}{sheetModule.estWeeks ? ' (estimado)' : ''}</div>
                      {sheetModule.objetivo && <div className="text-xs italic mt-1" style={{ color: MUTED }}>{sheetModule.objetivo}</div>}
                    </div>
                    <button onClick={() => setSheetId(null)} className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: BG }}>✕</button>
                  </div>

                  {sheetModule.overview && (
                    <div className="flex flex-wrap gap-2 mb-4">
                      {sheetModule.overview.map((o, i) => <span key={i} className="text-xs px-2 py-1 rounded-full" style={{ background: BG, color: MUTED }}>{o}</span>)}
                    </div>
                  )}

                  <div className="text-xs font-semibold uppercase tracking-wide mb-2" style={{ color: MUTED }}>Competencias</div>
                  <div className="space-y-2 mb-5">
                    {sheetModule.topics.map((t, i) => {
                      const checked = progress[sheetModule.id].checked[i];
                      return (
                        <button key={i} onClick={() => toggleTopic(sheetModule.id, i)} className="flex items-center gap-2 w-full text-left text-sm">
                          <span>{checked ? '✅' : '⚪'}</span>
                          <span style={{ color: checked ? MUTED : INK, textDecoration: checked ? 'line-through' : 'none' }}>{t}</span>
                        </button>
                      );
                    })}
                  </div>

                  {sheetModule.projectLabel && (
                    <div className="rounded-2xl p-4 mb-5" style={{ background: '#FDEBD3' }}>
                      <div className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: '#B5701A' }}>{sheetModule.projectLabel}</div>
                      <p className="text-sm" style={{ color: INK }}>{sheetModule.proyecto}</p>
                    </div>
                  )}

                  {sheetModule.libros && sheetModule.libros.length > 0 && (
                    <div className="mb-4">
                      <div className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: MUTED }}>Libros</div>
                      <ul className="text-sm space-y-1">{sheetModule.libros.map((b, i) => <li key={i} style={{ color: INK }}>{b}</li>)}</ul>
                    </div>
                  )}
                  {sheetModule.recursosOficiales && (
                    <div className="mb-4">
                      <div className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: MUTED }}>Oficiales</div>
                      <ul className="text-sm space-y-1">{sheetModule.recursosOficiales.map((b, i) => <li key={i} style={{ color: INK }}>{b}</li>)}</ul>
                    </div>
                  )}
                  {sheetModule.recursos && (
                    <div className="mb-4">
                      <div className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: MUTED }}>Bancos</div>
                      <ul className="text-sm space-y-1">{sheetModule.recursos.map((b, i) => <li key={i} style={{ color: INK }}>{b}</li>)}</ul>
                    </div>
                  )}
                  {sheetModule.youtube && (
                    <div className="mb-4">
                      <div className="text-xs font-semibold uppercase tracking-wide mb-1" style={{ color: MUTED }}>{sheetModule.youtubeLabel || 'YouTube'}</div>
                      <ul className="text-sm space-y-1">{sheetModule.youtube.map((b, i) => <li key={i} style={{ color: INK }}>{b}</li>)}</ul>
                    </div>
                  )}

                  <div className="pt-3 mt-2" style={{ borderTop: `1px solid ${BG}` }}>
                    <label className="text-xs font-semibold uppercase tracking-wide block mb-1" style={{ color: MUTED }}>Horas dedicadas</label>
                    <input type="number" min="0" value={progress[sheetModule.id].hours}
                      onChange={e => updateHours(sheetModule.id, Math.max(0, Number(e.target.value) || 0))}
                      className="w-24 rounded-xl px-3 py-2 text-sm mb-4" style={{ background: BG, border: 'none', color: INK }} />
                    <label className="text-xs font-semibold uppercase tracking-wide block mb-1" style={{ color: MUTED }}>Notas</label>
                    <textarea value={progress[sheetModule.id].notes} onChange={e => updateNotes(sheetModule.id, e.target.value)} rows={3}
                      className="w-full rounded-xl px-3 py-2 text-sm" style={{ background: BG, border: 'none', color: INK }}
                      placeholder="Apuntes, dudas, referencias..." />
                  </div>
                </React.Fragment>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
